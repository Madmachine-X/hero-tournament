<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무명 동작 미리보기</title>
<style>
 body{margin:0;background:#1b1a17;color:#eee;font-family:system-ui,sans-serif}
 header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
 h1{font-size:18px;margin:0 12px 0 0}
 button{background:#2c2a25;color:#eee;border:1px solid #555;border-radius:6px;padding:6px 12px;cursor:pointer}
 button.on{border-color:#e8c06a;color:#e8c06a}
 canvas{display:block;width:100%;max-width:1400px;margin:0 auto;background:#8c8664}
 p{padding:0 16px;color:#aaa;font-size:13px}
</style></head><body>
<header><h1>무명 동작 미리보기</h1>
 <span>갑옷</span><button data-a="" class="on">없음</button><button data-a="a_chalgap">찰갑</button><button data-a="a_dujeong">두정갑</button>
 <span style="margin-left:12px">속도</span><button data-s="1" class="on">1×</button><button data-s="0.5">½×</button><button data-s="0.2">느리게</button>
</header>
<canvas id="cv" width="1400" height="560"></canvas>
<p>게임과 분리된 시험 화면입니다. 확정되면 게임에 넣습니다.</p>
<script src="mocap.js"></script>
<script src="rig-lab.js"></script>
<script>
const cv=document.getElementById('cv'), c=cv.getContext('2d');
let armor=null, speed=1, t=0, last=performance.now();
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{armor=b.dataset.a||null;document.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x===b));});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));});
RigLab.warm();
const H=300, GY=470, WALK=MOCAP.walkSpeed*MOCAP.unit*(H/477);
const us=[
 {label:'서 있기', x:230, mode:'idle'},
 {label:'걷기', x:700, mode:'walk'},
 {label:'베기', x:1130, mode:'atk', cd:1.2},
].map(o=>Object.assign({hid:'hero',y:GY,r:12,vx:0,vy:0,bob:Math.random()*6,swing:0,lastSwing:0,w1Id:'w_hwando',atkT:1.2},o));
let scroll=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000)*speed; last=now; render(dt);
  requestAnimationFrame(frame);
}
function render(dt){
  t+=dt;
  c.fillStyle='#8c8664'; c.fillRect(0,0,cv.width,cv.height);
  c.fillStyle='#7a7556'; c.fillRect(0,GY,cv.width,cv.height-GY);
  scroll=(scroll+WALK*dt)%60;
  c.strokeStyle='rgba(0,0,0,.18)'; c.lineWidth=2;
  for(let x=470-scroll;x<930;x+=60){c.beginPath();c.moveTo(x,GY+4);c.lineTo(x-14,GY+40);c.stroke();}
  for(const u of us){
    u.armorId=armor;
    if(u.mode==='walk'){u.vx=WALK;}
    if(u.mode==='atk'){u.reachT=t; u.atkT-=dt; if(u.atkT<=0){u.atkT=u.cd; u.swing=(u.swing||0)+1;}}
    c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(u.x,GY,46,10,0,0,7); c.fill();
    if(RigLab.has('hero')) RigLab.draw(c,u,t,GY,1,H);
    c.fillStyle='#222'; c.font='18px sans-serif'; c.textAlign='center'; c.fillText(u.label,u.x,GY+60);
  }
}
/* 시험용: ?manual 이면 자동 재생 대신 window.step(초) 로 한 장씩 */
window.step=(dt)=>render(dt);
if(!/manual/.test(location.search)) requestAnimationFrame(frame);
</script></body></html>
